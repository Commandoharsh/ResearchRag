services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: researchrag-backend
    env_file:
      - .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      HF_HOME: /app/.cache/huggingface
    volumes:
      - researchrag_data:/app/data
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: researchrag-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  # Ollama is containerized for a self-contained local deployment.
  # Pull the model separately after the service starts.
  ollama:
    image: ollama/ollama:latest
    container_name: researchrag-ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  researchrag_data:
  huggingface_cache:
  ollama_models:
